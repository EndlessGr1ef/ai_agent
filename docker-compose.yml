version: '3.9'

services:
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: chromadb
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=TRUE
    volumes:
      - ./chromadb:/chroma/chroma
    ports:
      - "9000:8000"
    restart: unless-stopped